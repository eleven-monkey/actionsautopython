name: 翻译YouTube字幕并上传到B站

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube视频URL'
        required: true
        type: string
      api_config_name:
        description: 'API配置名称 (在仓库secrets中配置)'
        required: true
        default: 'default'
        type: choice
        options:
          - default
          - qwen36
          - hy_mt2
          - custom1
          - custom2
      segment_size:
        description: '分段大小 (每次翻译的段落数)'
        required: true
        default: '11'
        type: string
      max_workers:
        description: '并发请求数 (同时翻译的线程数)'
        required: true
        default: '8'
        type: string
      keep_timestamps:
        description: '保留时间戳'
        required: true
        default: 'true'
        type: boolean
      use_cookies:
        description: '使用cookies (需要先设置YOUTUBE_COOKIES secret)'
        required: true
        default: 'true'
        type: boolean
      voice_name:
        description: '朗读音色'
        required: true
        default: 'zh-CN-XiaoxiaoNeural'
        type: choice
        options:
          - zh-CN-XiaoxiaoNeural
          - zh-CN-YunjianNeural
          - zh-CN-YunxiNeural
      upload_bilibili:
        description: '上传到B站'
        required: true
        default: true
        type: boolean
      upload_dailymotion:
        description: '上传到Dailymotion'
        required: true
        default: false
        type: boolean

jobs:
  translate_and_upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        
      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          # Also link to global path as backup
          sudo ln -sf $HOME/.deno/bin/deno /usr/local/bin/deno
          
      - name: Check Deno version
        run: |
          deno --version
          which deno


      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install https://github.com/yt-dlp/yt-dlp/archive/master.zip
          pip install requests edge-tts pydub numpy pillow bilibili-api-python aiohttp

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          
      - name: 创建字幕目录
        run: mkdir -p subtitles
        
      - name: 创建cookies文件（如果启用）
        if: github.event.inputs.use_cookies == 'true'
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > youtube_cookies.txt
          echo "cookies文件已创建"
          
      - name: 创建API配置文件
        run: |
          cat > api_config.json << EOF
          {
            "url": "${{ secrets[format('API_URL_{0}', github.event.inputs.api_config_name)] }}",
            "api_key": "${{ secrets[format('API_KEY_{0}', github.event.inputs.api_config_name)] }}",
            "model_name": "${{ secrets[format('API_MODEL_{0}', github.event.inputs.api_config_name)] }}"
          }
          EOF
          
      - name: 下载YouTube字幕
        run: |
          # 设置遇到错误立即退出，避免后续命令执行
          set -e
          echo "===== 开始下载YouTube字幕 ====="
          echo "YouTube URL: ${{ github.event.inputs.youtube_url }}"
          echo "是否使用Cookies: ${{ github.event.inputs.use_cookies }}"

          if [ "${{ github.event.inputs.use_cookies }}" == "true" ]; then
            echo "检测到使用Cookies，开始下载..."
            python download_subtitles.py --url "${{ github.event.inputs.youtube_url }}" --cookies youtube_cookies.txt
          else
            echo "不使用Cookies，开始下载..."
            python download_subtitles.py --url "${{ github.event.inputs.youtube_url }}"
          fi

          echo "===== 字幕下载步骤成功完成 ====="
          
      - name: 翻译字幕（保留时间戳）
        if: github.event.inputs.keep_timestamps == 'true'
        run: |
          python translate_subtitles.py \
            --api_config_file api_config.json \
            --segment_size "${{ github.event.inputs.segment_size }}" \
            --keep_timestamps \
            --max_workers "${{ github.event.inputs.max_workers }}"
            
      - name: 翻译字幕（不保留时间戳）
        if: github.event.inputs.keep_timestamps != 'true'
        run: |
          python translate_subtitles.py \
            --api_config_file api_config.json \
            --segment_size "${{ github.event.inputs.segment_size }}" \
            --max_workers "${{ github.event.inputs.max_workers }}"

      - name: 生成语音
        run: |
          python tts.py --filepath 'subtitles/word_level_processed_translated.txt' --char "${{ github.event.inputs.voice_name }}"
          
      - name: Debug - List Files
        run: |
          ls -R subtitles/
          ls -l
          echo "===== MP3 时长 ====="
          ffprobe -v error -show_entries format=duration,bit_rate -of default=noprint_wrappers=1 subtitles/word_level_processed_translated.mp3 || true
          echo "===== MP3 各流 ====="
          ffprobe -v error -show_streams subtitles/word_level_processed_translated.mp3 | grep -E 'codec_type|duration|bit_rate' || true
          echo "===== 翻译文件行数 ====="
          wc -l subtitles/word_level_processed_translated.txt
          echo "===== 翻译文件首/末 3 行 ====="
          head -3 subtitles/word_level_processed_translated.txt
          echo "..."
          tail -3 subtitles/word_level_processed_translated.txt

      - name: 上传调试制品（字幕、MP3、最终视频）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translate-debug-${{ github.run_id }}
          path: |
            subtitles/word_level_processed.txt
            subtitles/word_level_processed_translated.txt
            subtitles/word_level_processed_translated.mp3
          if-no-files-found: ignore
          retention-days: 3

      - name: 上传视频到B站
        if: github.event.inputs.upload_bilibili == 'true'
        env:
          BILIBILI_SESSDATA: ${{ secrets.BILIBILI_SESSDATA }}
          BILIBILI_JCT: ${{ secrets.BILIBILI_JCT }}
        run: |
          if [ "${{ github.event.inputs.use_cookies }}" == "true" ]; then
            python youtube_to_bilibili.py \
              --url "${{ github.event.inputs.youtube_url }}" \
              --api_config api_config.json \
              --cookies youtube_cookies.txt \
              --upload-bilibili
          else
            python youtube_to_bilibili.py \
              --url "${{ github.event.inputs.youtube_url }}" \
              --api_config api_config.json \
              --upload-bilibili
          fi
          echo "===== 最终视频时长（工作目录内）====="
          find . -maxdepth 3 -name 'final_video.mp4' -print -exec ffprobe -v error -show_entries format=duration,bit_rate -of default=noprint_wrappers=1 {} \; || true
          find . -maxdepth 3 -name 'final_video.mp4' -print -exec ffprobe -v error -show_streams {} \; | grep -E 'codec_type|duration|bit_rate' || true

      - name: 上传最终视频到制品
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-video-${{ github.run_id }}
          path: |
            final_video.mp4
            /tmp/final_video.mp4
            /tmp/downloaded_video.mp4
            /tmp/cover.*
          if-no-files-found: ignore
          retention-days: 3

      - name: 上传视频到Dailymotion
        if: github.event.inputs.upload_dailymotion == 'true'
        env:
          BILIBILI_SESSDATA: ${{ secrets.BILIBILI_SESSDATA }}
          BILIBILI_JCT: ${{ secrets.BILIBILI_JCT }}
          DM_API_KEY: ${{ secrets.DM_API_KEY }}
          DM_API_SECRET: ${{ secrets.DM_API_SECRET }}
          DM_USERNAME: ${{ secrets.DM_USERNAME }}
          DM_PASSWORD: ${{ secrets.DM_PASSWORD }}
        run: |
          pip install dailymotion
          if [ "${{ github.event.inputs.use_cookies }}" == "true" ]; then
            python youtube_to_bilibili.py \
              --url "${{ github.event.inputs.youtube_url }}" \
              --api_config api_config.json \
              --cookies youtube_cookies.txt \
              --upload-dailymotion
          else
            python youtube_to_bilibili.py \
              --url "${{ github.event.inputs.youtube_url }}" \
              --api_config api_config.json \
              --upload-dailymotion
          fi
