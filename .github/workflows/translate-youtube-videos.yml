name: 翻译YouTube字幕并上传到B站

# 设计要点：
# 1. 拆成 2 个 job：prepare / upload
# 2. prepare 产出 artifact；upload 通过 download-artifact 复用产物
# 3. B 站上传失败时只需 Re-run jobs -> upload 即可单独重试，不必重跑 prepare

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube视频URL'
        required: true
        type: string
      api_config_name:
        description: 'API配置名称 (在仓库secrets中配置)'
        required: true
        default: 'default'
        type: choice
        options:
          - default
          - qwen36
          - hy_mt2
          - gemini
          - custom1
          - custom2
      segment_size:
        description: '分段大小 (每次翻译的段落数)'
        required: true
        default: '11'
        type: string
      max_workers:
        description: '并发请求数 (同时翻译的线程数)'
        required: true
        default: '8'
        type: string
      keep_timestamps:
        description: '保留时间戳'
        required: true
        default: 'true'
        type: boolean
      use_cookies:
        description: '使用cookies (需要先设置YOUTUBE_COOKIES secret)'
        required: true
        default: 'true'
        type: boolean
      voice_name:
        description: '朗读音色'
        required: true
        default: 'zh-CN-XiaoxiaoNeural'
        type: choice
        options:
          - zh-CN-XiaoxiaoNeural
          - zh-CN-YunjianNeural
          - zh-CN-YunxiNeural
      upload_bilibili:
        description: '上传到B站'
        required: true
        default: true
        type: boolean
      upload_dailymotion:
        description: '上传到Dailymotion'
        required: true
        default: false
        type: boolean

jobs:
  # ================================================================
  # 1) 准备阶段：字幕下载/翻译/TTS/视频合成/封面
  #    产出 upload-artifact (final_video.mp4 + cover.jpeg + upload_config.pkl)
  # ================================================================
  prepare:
    name: 字幕 + 视频 + 封面 准备
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.set.outputs.artifact_name }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: 归一化输入参数
        run: |
          {
            echo "YT_URL=${{ github.event.inputs.youtube_url }}"
            echo "API_CONFIG_NAME=${{ github.event.inputs.api_config_name }}"
            echo "SEGMENT_SIZE=${{ github.event.inputs.segment_size }}"
            echo "MAX_WORKERS=${{ github.event.inputs.max_workers }}"
            echo "KEEP_TIMESTAMPS=${{ github.event.inputs.keep_timestamps }}"
            echo "USE_COOKIES=${{ github.event.inputs.use_cookies }}"
            echo "VOICE_NAME=${{ github.event.inputs.voice_name }}"
            echo "UPLOAD_BILIBILI=${{ github.event.inputs.upload_bilibili }}"
            echo "UPLOAD_DAILYMOTION=${{ github.event.inputs.upload_dailymotion }}"
          } >> "$GITHUB_ENV"

      - name: 检出代码
        uses: actions/checkout@v4

      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          sudo ln -sf $HOME/.deno/bin/deno /usr/local/bin/deno

      - name: Check Deno version
        run: |
          deno --version
          which deno

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install https://github.com/yt-dlp/yt-dlp/archive/master.zip
          pip install requests edge-tts pydub numpy pillow bilibili-api-python aiohttp
          pip install huggingface_hub
          pip install google-genai
          pip install llama-cpp-python --no-cache-dir --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: 缓存HuggingFace本地兜底模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-hy-mt2-1.8b-q4_k_m-gguf

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 创建字幕目录
        run: mkdir -p subtitles

      - name: 创建cookies文件（如果启用）
        if: env.USE_COOKIES == 'true'
        env:
          COOKIES_SECRET: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "${COOKIES_SECRET}" > youtube_cookies.txt
          echo "cookies文件已创建"

      - name: 写入API配置
        env:
          API_NAME: ${{ env.API_CONFIG_NAME }}
        run: |
          cat > api_config.json <<EOF
          {
            "url": "${{ secrets[format('API_URL_{0}', env.API_NAME)] }}",
            "api_key": "${{ secrets[format('API_KEY_{0}', env.API_NAME)] }}",
            "model_name": "${{ secrets[format('API_MODEL_{0}', env.API_NAME)] }}",
            "type": "${{ env.API_CONFIG_NAME == 'gemini' && 'gemini' || 'openai' }}"
          }
          EOF
          echo "api_config.json 内容："
          cat api_config.json

      - name: 下载YouTube字幕
        env:
          YT_URL: ${{ env.YT_URL }}
          USE_COOKIES: ${{ env.USE_COOKIES }}
        run: |
          set -e
          echo "===== 开始下载YouTube字幕 ====="
          echo "YouTube URL: ${YT_URL}"
          echo "是否使用Cookies: ${USE_COOKIES}"
          if [ "${USE_COOKIES}" == "true" ]; then
            python download_subtitles.py --url "${YT_URL}" --cookies youtube_cookies.txt
          else
            python download_subtitles.py --url "${YT_URL}"
          fi
          echo "===== 字幕下载步骤成功完成 ====="

      - name: 翻译字幕（保留时间戳）
        if: env.KEEP_TIMESTAMPS == 'true'
        env:
          SEGMENT_SIZE: ${{ env.SEGMENT_SIZE }}
          MAX_WORKERS: ${{ env.MAX_WORKERS }}
        run: |
          python translate_subtitles.py \
            --api_config_file api_config.json \
            --segment_size "${SEGMENT_SIZE}" \
            --keep_timestamps \
            --max_workers "${MAX_WORKERS}"

      - name: 翻译字幕（不保留时间戳）
        if: env.KEEP_TIMESTAMPS != 'true'
        env:
          SEGMENT_SIZE: ${{ env.SEGMENT_SIZE }}
          MAX_WORKERS: ${{ env.MAX_WORKERS }}
        run: |
          python translate_subtitles.py \
            --api_config_file api_config.json \
            --segment_size "${SEGMENT_SIZE}" \
            --max_workers "${MAX_WORKERS}"

      - name: 生成语音
        env:
          VOICE_NAME: ${{ env.VOICE_NAME }}
        run: |
          python tts.py --filepath 'subtitles/word_level_processed_translated.txt' --char "${VOICE_NAME}"

      - name: Debug - List Files
        run: |
          ls -R subtitles/
          ls -l

      # prepare 阶段：仅产出 final_video.mp4 / cover.jpeg / upload_config.pkl
      - name: 准备视频+封面+上传配置 (仅 prepare，跳过上传)
        env:
          YT_URL: ${{ env.YT_URL }}
          USE_COOKIES: ${{ env.USE_COOKIES }}
        run: |
          if [ "${USE_COOKIES}" == "true" ]; then
            python youtube_to_bilibili.py \
              --url "${YT_URL}" \
              --api_config api_config.json \
              --cookies youtube_cookies.txt \
              --output_dir ./output \
              --skip-upload
          else
            python youtube_to_bilibili.py \
              --url "${YT_URL}" \
              --api_config api_config.json \
              --output_dir ./output \
              --skip-upload
          fi

      - name: 校验产物
        run: |
          ls -lh output/
          for f in final_video.mp4 cover.jpeg upload_config.pkl; do
            if [ ! -s "output/$f" ]; then
              echo "错误: 产物 output/$f 缺失或为空"
              exit 1
            fi
          done
          echo "产物校验通过"

      - name: 设置 artifact 名
        id: set
        run: echo "artifact_name=upload-artifact-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: 上传产物 artifact (供 upload job 使用)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set.outputs.artifact_name }}
          path: |
            output/final_video.mp4
            output/cover.jpeg
            output/upload_config.pkl
          retention-days: 3
          if-no-files-found: error

  # ================================================================
  # 2) 上传阶段：根据输入参数决定上传到 B 站 / Dailymotion
  #    失败时只需 Re-run jobs -> upload 即可单独重试
  # ================================================================
  upload:
    name: 上传视频
    needs: [prepare]
    if: success()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: 归一化输入
        run: |
          {
            echo "UPLOAD_BILIBILI=${{ github.event.inputs.upload_bilibili }}"
            echo "UPLOAD_DAILYMOTION=${{ github.event.inputs.upload_dailymotion }}"
          } >> "$GITHUB_ENV"

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖
        env:
          UPLOAD_BILIBILI: ${{ env.UPLOAD_BILIBILI }}
          UPLOAD_DAILYMOTION: ${{ env.UPLOAD_DAILYMOTION }}
        run: |
          python -m pip install --upgrade pip
          # 即使 --skip-prepare，youtube_to_bilibili.py 顶部也会强制 import
          # yt_dlp / PIL / bilibili_api，缺一个就 sys.exit(1)。
          # 因此这三个必须无条件安装。
          pip install yt-dlp pillow requests bilibili-api-python aiohttp
          if [ "${UPLOAD_DAILYMOTION}" == "true" ]; then
            pip install dailymotion
          fi

      - name: 下载 prepare 产物
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: ./output

      - name: 校验产物
        run: |
          ls -lh output/
          for f in final_video.mp4 cover.jpeg upload_config.pkl; do
            if [ ! -s "output/$f" ]; then
              echo "错误: 产物 output/$f 缺失或为空"
              exit 1
            fi
          done

      # upload 阶段不需要 --api_config（已经在 prepare 阶段用过）
      # 根据输入参数决定要跑哪些上传目标
      - name: 上传到 B 站
        if: env.UPLOAD_BILIBILI == 'true'
        env:
          BILIBILI_SESSDATA: ${{ secrets.BILIBILI_SESSDATA }}
          BILIBILI_JCT: ${{ secrets.BILIBILI_JCT }}
        run: |
          python youtube_to_bilibili.py \
            --url "placeholder" \
            --output_dir ./output \
            --skip-prepare \
            --upload-bilibili

      - name: 上传到 Dailymotion
        if: env.UPLOAD_DAILYMOTION == 'true'
        env:
          DM_API_KEY: ${{ secrets.DM_API_KEY }}
          DM_API_SECRET: ${{ secrets.DM_API_SECRET }}
          DM_USERNAME: ${{ secrets.DM_USERNAME }}
          DM_PASSWORD: ${{ secrets.DM_PASSWORD }}
        run: |
          python youtube_to_bilibili.py \
            --url "placeholder" \
            --output_dir ./output \
            --skip-prepare \
            --upload-dailymotion

      # 注：GitHub 官方没有 actions/delete-artifact，
      # 公共仓库的 artifact 需依赖 retention-days 自动过期（已设为 3 天）。
      # 要想立即清理，需在 UI 手动 Actions → Artifacts → Delete。
