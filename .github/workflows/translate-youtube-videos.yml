name: 翻译YouTube字幕

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube视频URL'
        required: true
        type: string
      api_config_name:
        description: 'API配置名称 (在仓库secrets中配置)'
        required: true
        default: 'default'
        type: choice
        options:
          - default
          - openai
          - claude
          - custom1
          - custom2
      segment_size:
        description: '分段大小 (每次翻译的段落数)'
        required: true
        default: '6'
        type: string
      keep_timestamps:
        description: '保留时间戳'
        required: true
        default: 'false'
        type: boolean
      use_cookies:
        description: '使用cookies (需要先设置YOUTUBE_COOKIES secret)'
        required: true
        default: 'false'
        type: boolean
      # 新增的输入：朗读音色
      voice_name:
        description: '朗读音色'
        required: true
        default: 'zh-CN-XiaoxiaoNeural'
        type: choice
        options:
          - zh-CN-XiaoxiaoNeural
          - zh-CN-YunjianNeural
          - zh-CN-YunxiNeural

jobs:
  translate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        
      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp requests edge_tts pydub numpy

        # 新增的步骤：安装系统依赖
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          
      - name: 创建字幕目录
        run: mkdir -p subtitles
        
      - name: 创建cookies文件（如果启用）
        if: github.event.inputs.use_cookies == 'true'
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > youtube_cookies.txt
          echo "cookies文件已创建"
          
      - name: 创建API配置文件
        run: |
          cat > api_config.json << EOF
          {
            "url": "${{ secrets[format('API_URL_{0}', github.event.inputs.api_config_name)] }}",
            "api_key": "${{ secrets[format('API_KEY_{0}', github.event.inputs.api_config_name)] }}",
            "model_name": "${{ secrets[format('API_MODEL_{0}', github.event.inputs.api_config_name)] }}"
          }
          EOF
          
      - name: 下载YouTube字幕
        run: |
          if [ "${{ github.event.inputs.use_cookies }}" == "true" ]; then
            python download_subtitles.py --url "${{ github.event.inputs.youtube_url }}" --cookies youtube_cookies.txt
          else
            python download_subtitles.py --url "${{ github.event.inputs.youtube_url }}"
          fi
          
      - name: 翻译字幕（保留时间戳）
        if: github.event.inputs.keep_timestamps == 'true'
        run: |
          python translate_subtitles.py \
            --api_config_file api_config.json \
            --segment_size "${{ github.event.inputs.segment_size }}" \
            --keep_timestamps
            
      - name: 翻译字幕（不保留时间戳）
        if: github.event.inputs.keep_timestamps != 'true'
        run: |
          python translate_subtitles.py \
            --api_config_file api_config.json \
            --segment_size "${{ github.event.inputs.segment_size }}"

      # 新增的步骤：运行TTS脚本
      - name: 生成语音
        run: |
          python tts.py --filepath 'subtitles/word_level_processed.txt' --char "${{ github.event.inputs.voice_name }}"
            
      - name: 上传翻译语音
        uses: actions/upload-artifact@v4
        with:
          name: translated-audios
          path: subtitles/*_translated.mp3